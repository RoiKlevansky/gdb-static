name: gdb-static-pipeline

on:
  pull_request:
    branches:
      # '**' rather than '*': a single star does not match '/', so PRs targeting
      # a nested branch (feature/..., hotfix/...) would silently get no CI.
      - '**'
  push:
    tags:
      - 'v*'

# No secrets required. The Nix store is restored from the GitHub Actions cache
# populated by seed-cache.yaml on develop, so runners fetch the cross
# toolchains instead of rebuilding gcc/musl from source.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        build_type: ["slim", "full"]
        architecture: ["x86_64", "arm", "aarch64", "powerpc", "mips", "mipsel"]

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: cachix/install-nix-action@v30
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
          accept-flake-config = true

    # Restore only. seed-cache.yaml owns the writes: if all 12 matrix jobs
    # saved their own ~1 GB store, one run would exhaust the 10 GB repo quota
    # and evict the toolchains it just wrote. The prefix fallback keeps builds
    # warm when flake.lock moves before the seed job has caught up.
    - uses: nix-community/cache-nix-action@v7
      with:
        primary-key: nix-${{ runner.os }}-${{ matrix.architecture }}-${{ hashFiles('flake.nix', 'flake.lock') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-${{ matrix.architecture }}-
        save: false

    - name: Build
      run: |
        nix build -L -o result-gdb \
          '.?submodules=1#gdb-static-${{ matrix.architecture }}-${{ matrix.build_type }}'

    - name: Test
      run: |
        nix build -L -o result-check \
          '.?submodules=1#checks.x86_64-linux.gdb-static-${{ matrix.architecture }}-${{ matrix.build_type }}'

    - name: Pack
      run: |
        tar -czf "gdb-static-${{ matrix.build_type }}-${{ matrix.architecture }}.tar.gz" \
          -C result-gdb/bin .

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: gdb-static-${{ matrix.architecture }}-${{ matrix.build_type }}
        path: gdb-static-*.tar.gz
        if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Publish release
      uses: softprops/action-gh-release@v2
      with:
        files: artifacts/**/*.tar.gz
        body: |
          There are 2 asset types:
          - Slim releases contain all of the base features.
          - Full releases also contain python & cross-architecture debugging support.
          Please note that full release binaries are bigger.
